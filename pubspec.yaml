name: my_first_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Standard Flutter Icons
  cupertino_icons: ^1.0.8

  # Local Storage & Data
  shared_preferences: ^2.3.2
  http: ^1.2.2

  # Utilities (Formatting dates/currency)
  intl: ^0.20.3

  # Security & Hardware
  local_auth: ^2.3.0

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Firebase & Authentication (Google Sign-In)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # 🎯 Push Notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # 🏦 KHQR — បង្កើត QR និងស្កេន QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  image_picker: ^1.2.4
  image: ^4.12.0

  # 🪪 ID Card OCR — ស្កេនអត្តសញ្ញាបណ្ណ
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0+2

  # 📍 Location — ស្វែងរកសាខាធនាគារជិតបំផុត
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # 📞 Phone & SMS — ហៅទូរស័ព្ទ និងផ្ញើ SMS
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2

  # 🔌 WebSocket — ទទួល command ពី backend
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icon/
    - assets/banks/

  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKhmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKhmer-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKhmer-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B1F3A"
    theme_color: "#0B1F3A"